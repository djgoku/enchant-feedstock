# rattler-build recipe for misemacs's two-provider enchant (hunspell + applespell).
#
# This is NOT part of the conda-forge PR — that lives in recipe/meta.yaml on the
# parent branch (enable-hunspell-applespell-providers). misemacs consumes THIS
# recipe via pixi git-source (pixi-build backend) or a pipeline `rattler-build`.
# Targets osx-arm64 (misemacs is Apple-Silicon-only), so --with-applespell is
# unconditional here. Proven to build enchant_hunspell.so + enchant_applespell.so.
context:
  version: "2.8.2"

package:
  name: enchant
  version: ${{ version }}

source:
  url: https://github.com/rrthomas/enchant/releases/download/v${{ version }}/enchant-${{ version }}.tar.gz
  sha256: 8f19535adb5577b83b00e02f330fe9b9eb40dd21f19e2899636fc4d3a7696375

build:
  number: 0
  script: |
    export OBJCXX="${CXX}"
    export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
    export HUNSPELL_CFLAGS="-I${PREFIX}/include/hunspell"
    export HUNSPELL_LIBS="-L${PREFIX}/lib -lhunspell-1.7"
    export GLIB_CFLAGS="-I${PREFIX}/include/glib-2.0 -I${PREFIX}/lib/glib-2.0/include"
    export GLIB_LIBS="-L${PREFIX}/lib -lglib-2.0 -lgobject-2.0 -lgmodule-2.0 -lgio-2.0"
    ./configure --prefix="${PREFIX}" --disable-static --enable-relocatable --disable-vala --with-applespell LDFLAGS="-Wl,-rpath,${PREFIX}/lib"
    make -j"${CPU_COUNT:-4}"
    make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - pkg-config
    - groff
  host:
    - glib
    - hunspell
  run:
    - glib
    - hunspell

tests:
  - script:
      - test -f "${PREFIX}/lib/enchant-2/enchant_hunspell.so"
      - test -f "${PREFIX}/lib/enchant-2/enchant_applespell.so"
      - enchant-2 -v

about:
  license: LGPL-2.1-only
  summary: enchant (misemacs build - hunspell + applespell providers)
