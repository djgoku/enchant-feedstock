schema_version: 1

context:
  name: enchant
  version: "2.8.15"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/rrthomas/${{ name }}/releases/download/v${{ version }}/enchant-${{ version }}.tar.gz
  sha256: d3fd9e4170bfb5110b0bda577fe764a38fb606b3c25d2f0c3840234521ff1252
  patches:
    - hunspell-dictionaries.patch
    - self-relocate.patch

build:
  number: 0
  skip: not unix

requirements:
  build:
    - make
    - pkg-config
    - autoconf
    - automake
    - libtool
    - zlib
    - groff
    - doxygen
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - glib
    - hunspell
    - zlib
  run:
    - glib
    - hunspell
  run_exports:
    - ${{ pin_subpackage('enchant', upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - enchant-2
      files:
        - lib/enchant-2/enchant_hunspell.so
  - if: osx
    then:
      package_contents:
        files:
          - lib/enchant-2/enchant_applespell.so
  - requirements:
      run:
        - hunspell-en
    script:
      - enchant-2 -v
      - enchant-lsmod-2 | grep 'hunspell (Hunspell Provider)'
      - enchant-lsmod-2 -lang en_US | grep 'hunspell'
      - test "$(printf 'hello\nzzzxqvnotaword\n' | enchant-2 -d en_US -l)" = zzzxqvnotaword

about:
  license: LGPL-2.1-only
  license_file: COPYING.LIB
  summary: enchant spellchecking library
  homepage: https://rrthomas.github.io/enchant/

extra:
  feedstock-name: enchant
  recipe-maintainers:
    - asmeurer
    - izahn
    - wolfv
